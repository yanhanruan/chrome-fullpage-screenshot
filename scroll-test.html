<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>双向滚动条测试页面</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      font-family: Arial, sans-serif;
    }

    /* 故意把内容做得又宽又高 */
    .container {
      width: 3000px;
      height: 2000px;
      background: repeating-linear-gradient(
        45deg,
        #f5f5f5,
        #f5f5f5 20px,
        #e0e0e0 20px,
        #e0e0e0 40px
      );
      position: relative;
    }

    .block {
      position: absolute;
      width: 300px;
      height: 200px;
      border: 2px solid #333;
      background: #fff;
      box-sizing: border-box;
      padding: 10px;
    }

    .block h3 {
      margin: 0 0 8px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 左上角 -->
    <div class="block" style="top: 20px; left: 20px;">
      <h3>LEFT TOP</h3>
      <p>x: 0</p>
      <p>y: 0</p>
    </div>

    <!-- 右上角 -->
    <div class="block" style="top: 20px; left: 2600px;">
      <h3>RIGHT TOP</h3>
      <p>x: max</p>
      <p>y: 0</p>
    </div>

    <!-- 左下角 -->
    <div class="block" style="top: 1700px; left: 20px;">
      <h3>LEFT BOTTOM</h3>
      <p>x: 0</p>
      <p>y: max</p>
    </div>

    <!-- 右下角 -->
    <div class="block" style="top: 1700px; left: 2600px;">
      <h3>RIGHT BOTTOM</h3>
      <p>x: max</p>
      <p>y: max</p>
    </div>

    <!-- 中央 -->
    <div class="block" style="top: 900px; left: 1300px;">
      <h3>CENTER</h3>
      <p>用于判断截图是否完整</p>
    </div>
  </div>
</body>
</html>
